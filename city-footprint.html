<head>

  <title>City Footprint — The Modern Gallery</title>
  <style>
    body { overflow: hidden; }

    .analytics-layout {
      display: flex;
      height: calc(100vh - 56px);
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 300px;
      min-width: 300px;
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
    }

    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--color-border); }

    .sidebar-header {
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--color-border);
    }

    .sidebar-label {
      font-size: 0.55rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: 8px;
    }

    .sidebar-title {
      font-family: var(--font-serif);
      font-size: 1.7rem;
      font-weight: 300;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .sidebar-desc {
      font-size: 0.72rem;
      color: var(--color-text-muted);
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .view-all-btn {
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: 1px solid var(--color-border);
      background: none;
      padding: 5px 12px;
      cursor: pointer;
      font-family: var(--font-sans);
      color: var(--color-text-muted);
      transition: all 0.15s;
    }

    .view-all-btn:hover {
      border-color: var(--color-text);
      color: var(--color-text);
    }

    /* ── Summary stats ── */
    .summary-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--color-border);
      border-bottom: 1px solid var(--color-border);
    }

    .summary-stat {
      background: var(--color-bg);
      padding: 13px 16px;
    }

    .summary-val {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 300;
      line-height: 1;
      margin-bottom: 3px;
    }

    .summary-lbl {
      font-size: 0.48rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    /* ── Rank list ── */
    .rank-section-label {
      font-size: 0.5rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      padding: 13px 24px 9px;
      border-bottom: 1px solid var(--color-border);
    }

    .rank-list {
      flex: 1;
      padding: 0 24px;
    }

    .rank-item {
      padding: 11px 0;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .rank-item:last-child { border-bottom: none; }
    .rank-item:hover { opacity: 0.7; }
    .rank-item.active .rank-city { font-weight: 500; }

    .rank-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 2px;
    }

    .rank-num {
      font-size: 0.5rem;
      color: var(--color-text-muted);
      width: 14px;
      flex-shrink: 0;
      text-align: right;
    }

    .rank-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
      top: -1px;
    }

    .rank-city {
      font-size: 0.8rem;
      flex: 1;
      line-height: 1.2;
    }

    .rank-area {
      font-family: var(--font-serif);
      font-size: 0.88rem;
      font-weight: 300;
      white-space: nowrap;
      color: var(--color-text);
    }

    .rank-meta {
      font-size: 0.55rem;
      color: var(--color-text-muted);
      letter-spacing: 0.03em;
      margin-left: 21px;
      margin-bottom: 7px;
    }

    .rank-bar-track {
      height: 2px;
      background: var(--color-border);
      margin-left: 21px;
      border-radius: 1px;
      overflow: hidden;
    }

    .rank-bar-fill {
      height: 100%;
      border-radius: 1px;
      transition: width 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    /* ── Map ── */
    .map-panel {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    #footprint-map {
      width: 100%;
      height: 100%;
    }

    /* ── Legend ── */
    .map-legend {
      position: absolute;
      bottom: 28px;
      left: 12px;
      z-index: 500;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.56rem;
      color: var(--color-text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }
  </style>
</head>

  { date:"2023-04-12T16:00:00", type:"landmark",   name:"Sydney Opera House",                   city:"Sydney",            country:"Australia",      lat:-33.856668575427555, lng:151.21575267549636 },
  { date:"2019-04-13T14:50:00", type:"landmark",   name:"Eiger, Mönch and Jungfrau",            city:"Lauterbrunnen",     country:"Switzerland",    lat:46.574838350448530,  lng:7.975742041690927  }
];

// ─── Algorithms ──────────────────────────────────────

function convexHull(pts) {
  if (pts.length <= 2) return pts.slice();
  const points = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (O, A, B) => (A[0]-O[0])*(B[1]-O[1]) - (A[1]-O[1])*(B[0]-O[0]);
  const lower = [];
  for (const p of points) {
    while (lower.length >= 2 && cross(lower.at(-2), lower.at(-1), p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = points.length - 1; i >= 0; i--) {
    while (upper.length >= 2 && cross(upper.at(-2), upper.at(-1), points[i]) <= 0) upper.pop();
    upper.push(points[i]);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

function polygonAreaKm2(hull) {
  if (hull.length < 3) return 0;
  const avgLat = hull.reduce((s, p) => s + p[1], 0) / hull.length;
  const latKm  = 111.32;
  const lngKm  = 111.32 * Math.cos(avgLat * Math.PI / 180);
  let area = 0;
  for (let i = 0; i < hull.length; i++) {
    const j = (i + 1) % hull.length;
    area += (hull[i][0] * lngKm) * (hull[j][1] * latKm);
    area -= (hull[j][0] * lngKm) * (hull[i][1] * latKm);
  }
  return Math.abs(area) / 2;
}

function maxSpanKm(points) {
  if (points.length < 2) return 0;
  const lats   = points.map(p => p[1]);
  const lngs   = points.map(p => p[0]);
  const avgLat = lats.reduce((a, b) => a + b, 0) / lats.length;
  const dLat   = (Math.max(...lats) - Math.min(...lats)) * 111.32;
  const dLng   = (Math.max(...lngs) - Math.min(...lngs)) * 111.32 * Math.cos(avgLat * Math.PI / 180);
  return Math.sqrt(dLat * dLat + dLng * dLng);
}

// ─── Compute per-city data ───────────────────────────

function computeCities(data) {
  const grouped = {};
  for (const item of data) {
    if (!grouped[item.city]) grouped[item.city] = { country: item.country, stops: [] };
    grouped[item.city].stops.push(item);
  }
  return Object.entries(grouped).map(([city, { country, stops }]) => {
    const points = stops.map(s => [s.lng, s.lat]);
    const hull   = convexHull(points);
    const area   = polygonAreaKm2(hull);
    const span   = maxSpanKm(points);
    const avgLat = points.reduce((s, p) => s + p[1], 0) / points.length;
    const avgLng = points.reduce((s, p) => s + p[0], 0) / points.length;
    return { city, country, stops, points, hull, area, span, center: [avgLat, avgLng] };
  }).sort((a, b) => b.area - a.area || b.span - a.span || b.stops.length - a.stops.length);
}

const cities = computeCities(travelData);

// ─── Map setup ───────────────────────────────────────

const map = L.map('footprint-map', { zoomControl: false });
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 18
}).addTo(map);

const layers = {};
let globalBounds = null;
let selectedCity = null;

const defaultStyle = color => ({
  color, fillColor: color, fillOpacity: 0.09, weight: 1.5, opacity: 0.65
});
const activeStyle = () => ({
  fillOpacity: 0.22, weight: 2.5, opacity: 1
});

// ─── Render map ──────────────────────────────────────

function renderMap() {
  const allPts = [];

  for (const c of cities) {
    const color = COUNTRY_COLORS[c.country] || '#888';
    let layer;

    const tooltip =
      `<strong style="font-family:serif;font-weight:400;font-size:13px">${c.city}</strong><br>` +
      `<span style="font-size:11px;color:#999">${c.country} &nbsp;·&nbsp; ${c.stops.length} stop${c.stops.length > 1 ? 's' : ''}` +
      (c.area > 0.05 ? `<br>${c.area.toFixed(2)} km² footprint` : c.span > 0.1 ? `<br>${c.span.toFixed(1)} km span` : '') +
      `</span>`;

    if (c.hull.length >= 3 && c.area > 0.01) {
      const latlngs = c.hull.map(p => [p[1], p[0]]);
      layer = L.polygon(latlngs, defaultStyle(color));
    } else if (c.points.length >= 2) {
      const latlngs = c.points.map(p => [p[1], p[0]]);
      layer = L.polyline(latlngs, { color, weight: 2.5, opacity: 0.7, dashArray: '5 4' });
    } else {
      layer = L.circleMarker([c.center[0], c.center[1]], {
        radius: 6, color, fillColor: color, fillOpacity: 0.45, weight: 2
      });
    }

    layer.bindTooltip(tooltip, { sticky: true, offset: [10, 0] });
    layer.on('click', () => selectCity(c.city));
    layer.on('mouseover', () => { if (selectedCity !== c.city) layer.setStyle(activeStyle()); });
    layer.on('mouseout',  () => { if (selectedCity !== c.city) layer.setStyle(defaultStyle(color)); });

    layer.addTo(map);
    layers[c.city] = { layer, color };

    for (const p of c.points) allPts.push([p[1], p[0]]);
  }

  if (allPts.length) {
    globalBounds = L.latLngBounds(allPts);
    map.fitBounds(globalBounds.pad(0.08));
  }
}

// ─── Render sidebar ──────────────────────────────────

function renderSidebar() {
  const withArea    = cities.filter(c => c.area > 0.05);
  const largest     = withArea[0];
  const mostCompact = withArea.at(-1);

  document.getElementById('stat-cities').textContent      = cities.length;
  document.getElementById('stat-stops').textContent       = cities.reduce((s, c) => s + c.stops.length, 0);
  document.getElementById('stat-largest-val').textContent = largest ? largest.area.toFixed(0) : '—';
  document.getElementById('stat-compact-val').textContent = mostCompact ? mostCompact.city : '—';

  const maxArea = cities[0]?.area || 1;
  const maxSpan = Math.max(...cities.map(c => c.span));

  document.getElementById('rank-list').innerHTML = cities.map((c, i) => {
    const color = COUNTRY_COLORS[c.country] || '#888';

    let areaStr, barPct;
    if (c.area > 0.05) {
      areaStr = `${c.area.toFixed(1)} km²`;
      barPct  = (c.area / maxArea) * 100;
    } else if (c.span > 0.1) {
      areaStr = `${c.span.toFixed(1)} km span`;
      barPct  = (c.span / maxSpan) * 12;
    } else {
      areaStr = 'single location';
      barPct  = 1;
    }

    return `
      <div class="rank-item" data-city="${c.city}" onclick="selectCity('${c.city.replace(/'/g, "\\'")}')">
        <div class="rank-row">
          <span class="rank-num">${i + 1}</span>
          <span class="rank-dot" style="background:${color}"></span>
          <span class="rank-city">${c.city}</span>
          <span class="rank-area">${areaStr}</span>
        </div>
        <div class="rank-meta">${c.country} &nbsp;·&nbsp; ${c.stops.length} stop${c.stops.length > 1 ? 's' : ''}</div>
        <div class="rank-bar-track">
          <div class="rank-bar-fill" style="width:${barPct.toFixed(1)}%;background:${color}"></div>
        </div>
      </div>`;
  }).join('');
}

// ─── Render legend ───────────────────────────────────

function renderLegend() {
  const countries = [...new Set(cities.map(c => c.country))].sort();
  document.getElementById('map-legend').innerHTML = countries.map(co => `
    <div class="legend-item">
      <div class="legend-swatch" style="background:${COUNTRY_COLORS[co] || '#888'}"></div>
      ${co}
    </div>
  `).join('');
}

// ─── Interaction ─────────────────────────────────────

function selectCity(cityName) {
  if (selectedCity) {
    const prev = cities.find(c => c.city === selectedCity);
    if (prev) layers[selectedCity]?.layer.setStyle(defaultStyle(layers[selectedCity].color));
    document.querySelector(`.rank-item[data-city="${selectedCity}"]`)?.classList.remove('active');
  }

  selectedCity = cityName;
  const c = cities.find(c => c.city === cityName);
  if (!c) return;

  layers[cityName].layer.setStyle(activeStyle());
  layers[cityName].layer.bringToFront();

  const pts    = c.points.map(p => [p[1], p[0]]);
  const bounds = L.latLngBounds(pts);
  map.flyToBounds(bounds.pad(c.stops.length === 1 ? 3 : 0.5), { maxZoom: 14, duration: 0.9 });

  const el = document.querySelector(`.rank-item[data-city="${cityName}"]`);
  el?.classList.add('active');
  el?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function resetView() {
  if (selectedCity) {
    layers[selectedCity]?.layer.setStyle(defaultStyle(layers[selectedCity].color));
    document.querySelector(`.rank-item[data-city="${selectedCity}"]`)?.classList.remove('active');
    selectedCity = null;
  }
  if (globalBounds) map.flyToBounds(globalBounds.pad(0.08), { duration: 1 });
}

// ─── Init ────────────────────────────────────────────
renderMap();
renderSidebar();
renderLegend();

</script>
</body>
</html>
