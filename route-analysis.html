<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <title>Route Analysis — The Modern Gallery</title>
  <style>
    body { overflow: hidden; }

    .analytics-layout {
      display: flex;
      height: calc(100vh - 56px);
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 300px;
      min-width: 300px;
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
    }

    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--color-border); }

    .sidebar-header {
      padding: 28px 24px 22px;
      border-bottom: 1px solid var(--color-border);
    }

    .sidebar-label {
      font-size: 0.55rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: 8px;
    }

    .sidebar-title {
      font-family: var(--font-serif);
      font-size: 1.7rem;
      font-weight: 300;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .sidebar-desc {
      font-size: 0.72rem;
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    .s-section {
      padding: 16px 24px;
      border-bottom: 1px solid var(--color-border);
    }

    .s-label {
      font-size: 0.52rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: 10px;
    }

    /* city pills */
    .city-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .city-pill {
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border: 1px solid var(--color-border);
      background: none;
      cursor: pointer;
      color: var(--color-text-muted);
      transition: all 0.15s;
      font-family: var(--font-sans);
      line-height: 1.6;
    }

    .city-pill:hover {
      border-color: var(--color-text);
      color: var(--color-text);
    }

    .city-pill.active {
      background: var(--color-text);
      border-color: var(--color-text);
      color: var(--color-bg);
    }

    /* day tabs */
    .day-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .day-tab {
      font-size: 0.6rem;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border: 1px solid var(--color-border);
      background: none;
      cursor: pointer;
      color: var(--color-text-muted);
      transition: all 0.15s;
      font-family: var(--font-sans);
      line-height: 1.6;
    }

    .day-tab:hover {
      border-color: var(--color-text);
      color: var(--color-text);
    }

    .day-tab.active {
      background: var(--color-text);
      border-color: var(--color-text);
      color: var(--color-bg);
    }

    /* stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--color-border);
      border: 1px solid var(--color-border);
    }

    .stat-item {
      background: var(--color-bg);
      padding: 12px 8px;
      text-align: center;
    }

    .stat-value {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 300;
      line-height: 1;
      margin-bottom: 3px;
    }

    .stat-lbl {
      font-size: 0.48rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    /* timeline */
    .timeline {
      display: flex;
      flex-direction: column;
      padding: 16px 24px 24px;
      flex: 1;
    }

    .tl-stop {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0;
      position: relative;
    }

    .tl-stop:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 10px;
      top: 28px;
      width: 1px;
      height: calc(100% - 14px);
      background: var(--color-border);
    }

    .tl-dot {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 500;
      color: #fff;
      position: relative;
      z-index: 1;
      margin-top: 2px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.2);
    }

    .tl-info { flex: 1; min-width: 0; }

    .tl-time {
      font-size: 0.58rem;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      margin-bottom: 1px;
    }

    .tl-name {
      font-size: 0.8rem;
      line-height: 1.35;
      margin-bottom: 1px;
    }

    .tl-type {
      font-size: 0.52rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    /* map panel */
    .map-panel {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    #route-map {
      width: 100%;
      height: 100%;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(250, 249, 247, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      pointer-events: none;
    }

    .loading-overlay.hidden { display: none; }

    /* country accordion */
    .country-item {
      border-top: 1px solid var(--color-border);
    }

    .country-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 0;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      text-align: left;
      transition: color 0.15s;
    }

    .country-header:hover { color: var(--color-text); }
    .country-item.open .country-header { color: var(--color-text); }

    .country-arrow {
      font-size: 0.65rem;
      transition: transform 0.2s;
      display: inline-block;
      line-height: 1;
    }

    .country-item.open .country-arrow { transform: rotate(90deg); }

    .country-cities {
      display: none;
      flex-wrap: wrap;
      gap: 5px;
      padding-bottom: 14px;
    }

    .country-item.open .country-cities { display: flex; }

    /* route note badge */
    .route-note {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 500;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      padding: 6px 12px;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }
  </style>
</head>

// ─── Group by country → cities ───────────────────────
function buildCountries(data, cityDaysMap) {
  const map = {};
  for (const item of data) {
    if (!cityDaysMap[item.city]) continue;
    if (!map[item.country]) map[item.country] = new Set();
    map[item.country].add(item.city);
  }
  const result = {};
  for (const [country, cities] of Object.entries(map)) {
    result[country] = [...cities].sort();
  }
  return result;
}

// ─── Group by city → day ─────────────────────────────
function buildCityDays(data) {
  const raw = {};
  for (const item of data) {
    const day = item.date.slice(0, 10);
    if (!raw[item.city]) raw[item.city] = {};
    if (!raw[item.city][day]) raw[item.city][day] = [];
    raw[item.city][day].push(item);
  }
  const result = {};
  for (const [city, days] of Object.entries(raw)) {
    const valid = {};
    for (const [day, stops] of Object.entries(days)) {
      if (stops.length >= 2) {
        valid[day] = stops.slice().sort((a, b) => a.date.localeCompare(b.date));
      }
    }
    if (Object.keys(valid).length > 0) result[city] = valid;
  }
  return result;
}

const cityDays = buildCityDays(travelData);
const countryCities = buildCountries(travelData, cityDays);

// ─── Map ─────────────────────────────────────────────
const map = L.map('route-map', { zoomControl: false });
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 19
}).addTo(map);

map.setView([47.5, 19.05], 13);

let routeLayer = null;
const markerGroup = L.layerGroup().addTo(map);

// ─── Marker ──────────────────────────────────────────
function makeMarker(num, type) {
  const color = TYPE_COLORS[type] || '#1a1a1a';
  return L.divIcon({
    className: '',
    html: `<div style="width:26px;height:26px;background:${color};border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:500;font-family:'Inter',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,0.3);border:2px solid rgba(255,255,255,0.85)">${num}</div>`,
    iconSize: [26, 26],
    iconAnchor: [13, 13]
  });
}

// ─── OSRM ────────────────────────────────────────────
async function fetchRoute(stops) {
  const coords = stops.map(s => `${s.lng},${s.lat}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/foot/${coords}?overview=full&geometries=geojson`;
  const res = await fetch(url);
  if (!res.ok) return null;
  const data = await res.json();
  return (data.code === 'Ok' && data.routes.length) ? data.routes[0] : null;
}

// ─── Helpers ─────────────────────────────────────────
function fmtTime(s) {
  const d = new Date(s);
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  return `${h}:${m}`;
}

function fmtDate(dayStr) {
  const [y, mo, d] = dayStr.split('-').map(Number);
  const date = new Date(y, mo - 1, d);
  return date.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
}

function fmtDuration(stops) {
  const diff = (new Date(stops.at(-1).date) - new Date(stops[0].date)) / 3600000;
  return diff < 1 ? `<1` : diff.toFixed(1);
}

// ─── Render route ────────────────────────────────────
async function renderRoute(stops) {
  markerGroup.clearLayers();
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('route-note').style.display = 'none';

  // Stats
  document.getElementById('stat-stops').textContent  = stops.length;
  document.getElementById('stat-hours').textContent  = fmtDuration(stops);
  document.getElementById('stat-dist').textContent   = '—';

  // Timeline
  document.getElementById('timeline').innerHTML = stops.map((s, i) => `
    <div class="tl-stop">
      <div class="tl-dot" style="background:${TYPE_COLORS[s.type] || '#1a1a1a'}">${i + 1}</div>
      <div class="tl-info">
        <div class="tl-time">${fmtTime(s.date)}</div>
        <div class="tl-name">${s.name}</div>
        <div class="tl-type">${s.type}</div>
      </div>
    </div>
  `).join('');

  // Markers
  stops.forEach((s, i) => {
    L.marker([s.lat, s.lng], { icon: makeMarker(i + 1, s.type) })
      .bindPopup(`<strong style="font-family:serif;font-weight:400">${s.name}</strong><br><span style="font-size:11px;color:#999">${s.type} &nbsp;·&nbsp; ${fmtTime(s.date)}</span>`)
      .addTo(markerGroup);
  });

  // OSRM routing
  let routed = false;
  try {
    const route = await fetchRoute(stops);
    if (route) {
      const latlngs = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
      routeLayer = L.polyline(latlngs, { color: '#1a1a1a', weight: 2.5, opacity: 0.65 }).addTo(map);
      map.fitBounds(routeLayer.getBounds().pad(0.18));
      document.getElementById('stat-dist').textContent = (route.distance / 1000).toFixed(1);
      routed = true;
    }
  } catch (_) {}

  if (!routed) {
    const latlngs = stops.map(s => [s.lat, s.lng]);
    routeLayer = L.polyline(latlngs, { color: '#1a1a1a', weight: 2, opacity: 0.45, dashArray: '6 5' }).addTo(map);
    map.fitBounds(routeLayer.getBounds().pad(0.22));
    const note = document.getElementById('route-note');
    note.textContent = 'Straight-line fallback — street routing unavailable for this area';
    note.style.display = 'block';
  }

  document.getElementById('loading').classList.add('hidden');
}

// ─── UI state ────────────────────────────────────────
let activeCity    = 'Budapest';
let activeCountry = 'Hungary';
let activeDay     = null;

function toggleCountry(country) {
  activeCountry = activeCountry === country ? null : country;
  document.querySelectorAll('.country-item').forEach(el =>
    el.classList.toggle('open', el.dataset.country === activeCountry)
  );
}

function selectCity(city) {
  activeCity = city;
  // sync open country to match selected city
  for (const [country, cities] of Object.entries(countryCities)) {
    if (cities.includes(city)) { activeCountry = country; break; }
  }
  document.querySelectorAll('.country-item').forEach(el =>
    el.classList.toggle('open', el.dataset.country === activeCountry)
  );
  document.querySelectorAll('.city-pill').forEach(p =>
    p.classList.toggle('active', p.dataset.city === city)
  );
  renderDayTabs(city);
}

function renderDayTabs(city) {
  const days = Object.keys(cityDays[city]).sort();
  // default: day with most stops
  const best = days.reduce((a, b) =>
    cityDays[city][b].length > cityDays[city][a].length ? b : a
  );
  activeDay = best;

  document.getElementById('day-tabs').innerHTML = days.map(d => `
    <button class="day-tab${d === best ? ' active' : ''}" data-day="${d}" onclick="selectDay('${d}')">
      ${fmtDate(d)}
    </button>
  `).join('');

  renderRoute(cityDays[city][best]);
}

function selectDay(day) {
  activeDay = day;
  document.querySelectorAll('.day-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.day === day)
  );
  renderRoute(cityDays[activeCity][day]);
}

// ─── Init ─────────────────────────────────────────────
document.getElementById('country-list').innerHTML = Object.keys(countryCities).sort().map(country => `
  <div class="country-item${country === activeCountry ? ' open' : ''}" data-country="${country}">
    <button class="country-header" onclick="toggleCountry('${country}')">
      <span>${country}</span>
      <span class="country-arrow">›</span>
    </button>
    <div class="country-cities">
      ${countryCities[country].map(city => `
        <button class="city-pill${city === activeCity ? ' active' : ''}" data-city="${city}" onclick="selectCity('${city}')">
          ${city}
        </button>
      `).join('')}
    </div>
  </div>
`).join('');

renderDayTabs(activeCity);
</script>
