// ─── Helpers ─────────────────────────────────────────

function parseHM(dateStr) {
  return [parseInt(dateStr.slice(11,13)), parseInt(dateStr.slice(14,16))];
}

function minsToTime(mins) {
  const h = Math.floor(mins / 60) % 24;
  const m = Math.floor(mins % 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

// ─── Compute stats ───────────────────────────────────

// Type breakdown
const typeStats = {};
for (const s of travelData) {
  if (!typeStats[s.type]) typeStats[s.type] = { count: 0, totalMins: 0 };
  const [h, m] = parseHM(s.date);
  typeStats[s.type].count++;
  typeStats[s.type].totalMins += h * 60 + m;
}
const typeOrder = Object.entries(typeStats)
  .sort((a, b) => b[1].count - a[1].count)
  .map(([type, stats]) => ({ type, count: stats.count, avgMins: stats.totalMins / stats.count }));

// Country average first-stop-of-day
const dayFirstMins = {};
for (const s of travelData) {
  const key = `${s.country}|${s.date.slice(0,10)}`;
  const mins = parseInt(s.date.slice(11,13)) * 60 + parseInt(s.date.slice(14,16));
  if (!(key in dayFirstMins) || mins < dayFirstMins[key].mins) {
    dayFirstMins[key] = { country: s.country, mins };
  }
}
const countryTotals = {};
for (const { country, mins } of Object.values(dayFirstMins)) {
  if (!countryTotals[country]) countryTotals[country] = { total: 0, n: 0 };
  countryTotals[country].total += mins;
  countryTotals[country].n++;
}
const countryRhythm = Object.entries(countryTotals)
  .map(([country, { total, n }]) => ({ country, avgMins: total / n }))
  .sort((a, b) => a.avgMins - b.avgMins);

// ─── SVG helpers ─────────────────────────────────────

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, text = null) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== null) e.textContent = text;
  return e;
}

function timeToAngle(h, m = 0) {
  return (h + m / 60) / 24 * Math.PI * 2 - Math.PI / 2;
}

function annularArc(cx, cy, r1, r2, aStart, aEnd) {
  const [cos, sin] = [Math.cos, Math.sin];
  const span = aEnd - aStart;
  const large = span > Math.PI ? 1 : 0;
  const x1 = cx + r2*cos(aStart), y1 = cy + r2*sin(aStart);
  const x2 = cx + r2*cos(aEnd),   y2 = cy + r2*sin(aEnd);
  const x3 = cx + r1*cos(aEnd),   y3 = cy + r1*sin(aEnd);
  const x4 = cx + r1*cos(aStart), y4 = cy + r1*sin(aStart);
  return `M${x1},${y1} A${r2},${r2} 0 ${large},1 ${x2},${y2} L${x3},${y3} A${r1},${r1} 0 ${large},0 ${x4},${y4}Z`;
}

// ─── Build clock ─────────────────────────────────────

const CX = 300, CY = 300;
const INNER = 78, OUTER = 232;

const TIME_ZONES = [
  { start: 0,  end: 5,  fill: 'rgba(10,10,50,0.07)'     },
  { start: 5,  end: 8,  fill: 'rgba(255,180,80,0.08)'    },
  { start: 8,  end: 17, fill: 'rgba(255,255,210,0.06)'   },
  { start: 17, end: 20, fill: 'rgba(255,130,40,0.09)'    },
  { start: 20, end: 24, fill: 'rgba(10,10,50,0.07)'      },
];

function buildClock() {
  const svg = document.getElementById('clock-svg');

  // 1 — Day/night zones
  for (const z of TIME_ZONES) {
    svg.appendChild(el('path', {
      d: annularArc(CX, CY, INNER, OUTER, timeToAngle(z.start), timeToAngle(z.end)),
      fill: z.fill
    }));
  }

  // 2 — Guide rings
  for (const r of [INNER, INNER + 38, INNER + 77, INNER + 115, OUTER]) {
    svg.appendChild(el('circle', { cx: CX, cy: CY, r, fill: 'none', stroke: '#e0ddd8', 'stroke-width': '0.75' }));
  }

  // 3 — Hour tick marks + labels
  for (let h = 0; h < 24; h++) {
    const angle = timeToAngle(h);
    const isMajor = h % 6 === 0;
    const isMid   = h % 3 === 0;
    const tickLen = isMajor ? 14 : isMid ? 9 : 5;
    const tickR   = OUTER + 4;
    const cos = Math.cos(angle), sin = Math.sin(angle);

    svg.appendChild(el('line', {
      x1: CX + tickR * cos,            y1: CY + tickR * sin,
      x2: CX + (tickR + tickLen) * cos, y2: CY + (tickR + tickLen) * sin,
      stroke: isMajor ? '#b0ada8' : '#d0cdc8',
      'stroke-width': isMajor ? 1.2 : 0.8
    }));

    if (isMid) {
      const labelR = OUTER + (isMajor ? 32 : 26);
      const lx = CX + labelR * cos;
      const ly = CY + labelR * sin;
      svg.appendChild(el('text', {
        x: lx, y: ly,
        'text-anchor': 'middle',
        'dominant-baseline': 'middle',
        'font-family': 'Inter, sans-serif',
        'font-size': isMajor ? '11' : '9',
        fill: isMajor ? '#888' : '#aaa',
        'letter-spacing': '0.02em'
      }, `${String(h).padStart(2,'0')}`));
    }
  }

  // 4 — Center label
  svg.appendChild(el('text', {
    x: CX, y: CY - 10,
    'text-anchor': 'middle',
    'dominant-baseline': 'middle',
    'font-family': 'Cormorant Garamond, Georgia, serif',
    'font-size': '28',
    'font-weight': '300',
    fill: '#1a1a1a'
  }, travelData.length));

  svg.appendChild(el('text', {
    x: CX, y: CY + 14,
    'text-anchor': 'middle',
    'dominant-baseline': 'middle',
    'font-family': 'Inter, sans-serif',
    'font-size': '7.5',
    'letter-spacing': '0.18em',
    fill: '#aaa'
  }, 'STOPS'));

  // 5 — Stop dots
  const tooltip = document.getElementById('tooltip');

  travelData.forEach((stop, i) => {
    const [h, m] = parseHM(stop.date);
    const angle = timeToAngle(h, m);
    // Radius determined by minute (0min → inner, 59min → outer)
    // + tiny deterministic offset per stop index to prevent full overlap
    const rBase = INNER + (OUTER - INNER) * (m / 60);
    const jitter = ((i * 7 + stop.city.charCodeAt(0)) % 9) - 4;
    const r = Math.min(OUTER - 3, Math.max(INNER + 3, rBase + jitter));
    const x = CX + r * Math.cos(angle);
    const y = CY + r * Math.sin(angle);

    const dot = el('circle', {
      cx: x, cy: y, r: 5.5,
      fill: TYPE_COLORS[stop.type] || '#888',
      opacity: 0.82,
      'data-type': stop.type
    });
    dot.classList.add('clock-dot');

    dot.addEventListener('mouseenter', (e) => {
      dot.setAttribute('r', '8');
      dot.setAttribute('opacity', '1');
      tooltip.style.display = 'block';
      tooltip.innerHTML = `<strong>${stop.name}</strong><span>${stop.type} · ${stop.city}<br>${minsToTime(h*60+m)}</span>`;
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY - 44) + 'px';
    });
    dot.addEventListener('mousemove', (e) => {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY - 44) + 'px';
    });
    dot.addEventListener('mouseleave', () => {
      dot.setAttribute('r', '5.5');
      dot.setAttribute('opacity', '0.82');
      tooltip.style.display = 'none';
    });

    svg.appendChild(dot);
  });
}

// ─── Sidebar: type legend ────────────────────────────

let activeType = null;

function spotlightType(type) {
  document.querySelectorAll('.clock-dot').forEach(dot => {
    dot.classList.toggle('dimmed', dot.dataset.type !== type);
  });
  document.querySelectorAll('.type-legend-item').forEach(item => {
    item.classList.toggle('active',  item.dataset.type === type);
    item.classList.toggle('dimmed',  item.dataset.type !== type);
  });
}

function clearSpotlight() {
  document.querySelectorAll('.clock-dot').forEach(dot => dot.classList.remove('dimmed'));
  document.querySelectorAll('.type-legend-item').forEach(item => {
    item.classList.remove('active', 'dimmed');
  });
}

function toggleType(type) {
  if (activeType === type) {
    activeType = null;
    clearSpotlight();
  } else {
    activeType = type;
    spotlightType(type);
  }
}

function buildTypeLegend() {
  const container = document.getElementById('type-legend');
  container.innerHTML = typeOrder.map(({ type, count, avgMins }) => `
    <div class="type-legend-item" data-type="${type}" onclick="toggleType('${type}')">
      <span class="legend-dot" style="background:${TYPE_COLORS[type]}"></span>
      <span class="legend-name">${type}</span>
      <span class="legend-count">${count}</span>
      <span class="legend-avg">${minsToTime(avgMins)}</span>
    </div>
  `).join('');
}

// ─── Sidebar: country rhythm ─────────────────────────

function buildCountryRhythm() {
  const maxMins = Math.max(...countryRhythm.map(c => c.avgMins));
  const container = document.getElementById('country-rows');
  container.innerHTML = countryRhythm.map(({ country, avgMins }) => {
    const pct = (avgMins / (24 * 60)) * 100;
    return `
      <div class="country-row">
        <div class="country-row-top">
          <span class="country-name">${country}</span>
          <span class="country-time">${minsToTime(avgMins)}</span>
        </div>
        <div class="country-bar-track">
          <div class="country-bar-fill" style="width:${pct.toFixed(1)}%"></div>
        </div>
      </div>`;
  }).join('');
}

// ─── Init ────────────────────────────────────────────
buildClock();
buildTypeLegend();
buildCountryRhythm();
</script>
